<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Café Aurora | Login</title>
    <link rel="stylesheet" href="CSS/style.css">
</head>

<body>
    <header>
        <nav class="navbar"><a class="logo" href="index.html">Café <span>Aurora</span></a>
            <div class="menu"><a class="ativo" href="index.html">Início</a><a href="sobre.html">Sobre</a><a
                    href="produtos.html">Produtos</a><a href="pedidos.html">Pedidos</a><a class="login-link"
                    href="login.html">Entrar</a></div>
        </nav>
    </header>
    <main class="form-page">
        <form class="form-card" action="pedidos.html">
            <h1>Bem-vindo de volta!</h1>
            <p>Entre na sua conta para realizar e acompanhar pedidos.</p>
            <div class="form-group"><label for="email">E-mail</label><input id="email" type="email"
                    placeholder="seu@email.com" required></div>
            <div class="form-group"><label for="senha">Senha</label><input id="senha" type="password"
                    placeholder="Sua senha" required></div><button class="btn" type="submit">Entrar</button>
            <p class="form-help">Ainda não possui cadastro? <a href="#">Criar conta</a></p>
        </form>
    </main>
    <footer>
        <div class="copyright">© 2026 Café Aurora — Todos os direitos reservados.</div>
    </footer>
</body>

</html>
